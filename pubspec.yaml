name: vaultx
description: A secure, open-source local password manager.
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Cryptography — libsodium (Argon2id, XChaCha20-Poly1305, secretstream)
  sodium: ^4.1.0

  # Security & Auth
  root_checker_plus: any
  provider: ^6.1.1
  flutter_secure_storage: ^10.0.0
  local_auth: ^2.1.8
  
  # Data Handling
  uuid: ^4.2.1
  crypto: ^3.0.7
  encrypt: ^5.0.3
  pointycastle: ^3.7.3
  cupertino_icons: ^1.0.6
  fl_chart: ^1.2.0
  http: ^1.6.0
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  video_thumbnail: ^0.5.6
  path: ^1.9.1
  gal: ^2.3.2
  video_player: ^2.11.1
  chewie: ^1.13.0
  google_fonts: ^6.1.0
  camera: ^0.12.0+1
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

dependency_overrides:
  root_checker_plus: ^1.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png" 
  adaptive_icon_background: "#0F0F0F"
  adaptive_icon_foreground: "assets/icon.png"
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#0F0F0F"
    theme_color: "#0F0F0F"