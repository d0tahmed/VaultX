name: vaultx
description: A secure, open-source local password manager.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Security & Auth
  root_checker_plus: any
  provider: ^6.1.1
  flutter_secure_storage: ^10.0.0
  local_auth: ^2.1.8
  
  # Data Handling
  uuid: ^4.2.1
  crypto: ^3.0.3
  encrypt: ^5.0.3
  pointycastle: ^3.7.3
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  root_checker_plus: ^1.0.0